<!-- DOCTYPE - Serve para indicar para os navegadores qual a versão e qual o padrão de HTML está sendo usado -->
<!DOCTYPE html>

<!-- HTML - Elemento raiz. Tudo que pertence ao documento HTML fica dentro dele -->

<!-- LANG/ language(idioma) {Atributo} = Atributo responsavel pela linguagem
  do conteúdo do site. Além disso, tem um impacto muito grande na acessibilidade
  e SEO  -->
<html lang="pt-br">


<head>

  <!-- charset = essa configuração serve para indicar ao 
    navegador qual padrão/codificação de caracteres usar.
    Isso permite, utilizar palavras com acentos, caracteres
    especiais e emojis. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- title/titulo = Representa o título que aparece na aba do navegador para o usuário. -->
  <title>Portifolio</title>
</head>
<!-- body/corpo - conteudo visivel da pagina  onde o usuário interage e consome recursos da pagina. Por exemplo: Titulos, paragrafos,
  imagens, video, formulario e etc. -->

<body>
  Olá, Mundo. Esse é o meu programa em HTML.

</body>

</html>
